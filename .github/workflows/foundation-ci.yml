name: Farm OS foundation CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Kotlin architecture stabilization guardrails
        run: bash scripts/ci/verify-kotlin-architecture.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Domain, session and sync tests + Kotlin compile
        run: >-
          gradle
          :domain:goat:test
          :domain:rabbit:test
          :domain:ops:test
          :core:network:testDebugUnitTest
          :core:sync:testDebugUnitTest
          :app:compileDebugKotlin
          :core:database:compileDebugAndroidTestKotlin
          :app:compileDebugAndroidTestKotlin
          --stacktrace

  android-device-e2e:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free runner disk before AVD userdata allocation
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/sources || true
          df -h
      - name: Prove Room migration/restart durability and second-device authoritative visibility
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics -partition-size 2048
          script: bash scripts/ci/run-two-device-e2e.sh
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Validate CI harness shell syntax
        run: >-
          bash -n
          scripts/ci/verify-kotlin-architecture.sh
          scripts/ci/verify-search-pipeline.sh
          scripts/ci/prepare-two-device-e2e.sh
          scripts/ci/run-two-device-e2e.sh
      - name: Type-check Edge Functions and search tools
        run: >-
          deno check
          supabase/functions/meili-indexer/index.ts
          supabase/functions/meili-rebuild/index.ts
          supabase/functions/search-token/index.ts
          search/meilisearch/apply-index-contract.ts
          search/meilisearch/verify-live-contract.ts
      - name: Test Supabase API-key compatibility
        run: deno test --allow-env supabase/functions/tests/supabase_api_keys_test.ts

  meilisearch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MEILI_HOST: http://127.0.0.1:7700
      MEILI_MASTER_KEY: farm-os-ci-master-key-32-bytes-minimum
      MEILI_INDEX_PREFIX: farm-os
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Start pinned Meilisearch
        run: >-
          docker run -d --rm --name farm-os-meili
          -p 7700:7700
          -e MEILI_MASTER_KEY="$MEILI_MASTER_KEY"
          -e MEILI_NO_ANALYTICS=true
          getmeili/meilisearch:v1.53.1
      - name: Apply index contract and prove tenant isolation
        run: >-
          deno run --allow-net=127.0.0.1:7700
          --allow-env=MEILI_HOST,MEILI_MASTER_KEY,MEILI_INDEX_PREFIX
          --allow-read=search/meilisearch/animals-v1.settings.json
          search/meilisearch/verify-live-contract.ts

  search-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
      - name: Prove authoritative search handoff, outage recovery, tenant isolation and rebuild
        run: bash scripts/ci/verify-search-pipeline.sh

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Reset database from migrations
        run: supabase db reset
      - name: Run pgTAP contracts
        run: supabase test db
