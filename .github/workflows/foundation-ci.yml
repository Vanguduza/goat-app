name: Farm OS foundation CI

on:
  workflow_dispatch:
  push:
    branches:
      - implementation/foundation-vertical-slice
  pull_request:

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Domain, session and sync tests + debug build
        run: gradle :domain:goat:test :core:network:testDebugUnitTest :core:sync:testDebugUnitTest :app:assembleDebug --stacktrace

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Reset database from migrations
        run: supabase db reset
      - name: Run pgTAP contracts
        run: supabase test db
