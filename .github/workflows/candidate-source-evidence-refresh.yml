name: Candidate source evidence refresh
# retrigger: final-weight-profile-binding

on:
  push:
    branches: [chatgpt/goat-ux-repair-20261018]
    paths:
      - '.github/workflows/candidate-source-evidence-refresh.yml'

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Refresh pending source-derived evidence
        run: |
          set -euo pipefail
          python3 scripts/development/refresh_source_evidence.py --write
          git diff --check
          python3 - <<'PY'
          import subprocess, sys
          allowed = {
              "PROJECT_COMPLETION_STATE.json",
              "PROJECT_IMPLEMENTATION_STATE.json",
              "docs/realisation/FEATURE_ROUTE_COVERAGE.json",
              "docs/realisation/QDU_REGISTRY.json",
              "docs/ux/evidence/animal-farm-visual-lock/navigation-source-audit.json",
              "docs/ux/evidence/animal-farm-visual-lock/phase5-runtime-navigation-ledger.json",
              "docs/ux/evidence/animal-farm-visual-lock/route-screen-feature-gap-summary.json",
              "docs/ux/evidence/animal-farm-visual-lock/runtime-route-export.json",
          }
          changed = set(subprocess.check_output(["git","diff","--name-only"], text=True).splitlines())
          extra = changed - allowed
          if extra:
              sys.exit("unexpected refresh outputs: " + ", ".join(sorted(extra)))
          print("derived files:", ", ".join(sorted(changed)) or "none")
          PY

      - name: Commit refreshed pending evidence
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             PROJECT_COMPLETION_STATE.json             PROJECT_IMPLEMENTATION_STATE.json             docs/realisation/FEATURE_ROUTE_COVERAGE.json             docs/realisation/QDU_REGISTRY.json             docs/ux/evidence/animal-farm-visual-lock/navigation-source-audit.json             docs/ux/evidence/animal-farm-visual-lock/phase5-runtime-navigation-ledger.json             docs/ux/evidence/animal-farm-visual-lock/route-screen-feature-gap-summary.json             docs/ux/evidence/animal-farm-visual-lock/runtime-route-export.json
          git diff --cached --check
          git commit -m "chore(evidence): refresh pending proof after weight CI repair"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch final verification on refreshed head
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run foundation-ci.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run html-native-parity.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run appwide-native-review.yml --ref "${GITHUB_REF_NAME}"
