name: App-wide native visual review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'core/design/**'
      - 'feature/**'
      - 'scripts/testing/native-module-review.gradle'
      - 'scripts/testing/native-review-selection.json'
      - 'scripts/testing/run-native-review.py'
      - 'scripts/design/audit_native_visual_certification.py'
      - 'scripts/design/test_native_visual_certification.py'
      - '.github/workflows/appwide-native-review.yml'

permissions:
  contents: read

concurrency:
  group: appwide-native-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        mode: [LIGHT, DARK, OUTDOOR]
        width: [360, 411, 780]
        scale: ['1', '1.3', '2']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure the Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          manager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$manager"
          echo "$(dirname "$manager")" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Verify native evidence integrity controls
        run: python3 scripts/design/test_native_visual_certification.py
      - name: Render and verify actual native owners, states and lower content
        run: >-
          python3 scripts/testing/run-native-review.py
          --mode '${{ matrix.mode }}'
          --width '${{ matrix.width }}'
          --scale '${{ matrix.scale }}'
          --output app/build/reports/full-native-review
          --timeout-seconds 2100
      - name: Upload unapproved full-matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-native-${{ matrix.mode }}-w${{ matrix.width }}-f${{ matrix.scale }}
          path: app/build/reports/full-native-review/**
          if-no-files-found: error
          retention-days: 30
