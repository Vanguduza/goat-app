name: App-wide native visual review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'core/design/**'
      - 'feature/**'
      - 'scripts/testing/native-module-review.gradle'
      - '.github/workflows/appwide-native-review.yml'

permissions:
  contents: read

concurrency:
  group: appwide-native-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: light-phone
            mode: LIGHT
            width: 411
            scale: '1'
          - name: dark-phone
            mode: DARK
            width: 411
            scale: '1'
          - name: outdoor-large-text
            mode: OUTDOOR
            width: 360
            scale: '2'
          - name: light-tablet
            mode: LIGHT
            width: 780
            scale: '1.3'
    env:
      GOAT_MODULE_REVIEW_MODE: ${{ matrix.mode }}
      GOAT_MODULE_REVIEW_WIDTH: ${{ matrix.width }}
      GOAT_MODULE_REVIEW_SCALE: ${{ matrix.scale }}
      GOAT_MODULE_REVIEW_DIR: ${{ github.workspace }}/app/build/reports/native-module-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure the Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          manager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$manager"
          echo "$(dirname "$manager")" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Render and verify actual module navigation
        run: >-
          ./gradlew :app:testDebugUnitTest
          -I scripts/testing/native-module-review.gradle
          --no-parallel --max-workers=2 --continue --stacktrace
          --tests com.farmos.app.SheepRecordRuntimeNavigationTest
          --tests com.farmos.app.CattleRecordRuntimeNavigationTest
          --tests com.farmos.app.PoultryRecordRuntimeNavigationTest
          --tests com.farmos.app.FeedRecordRuntimeNavigationTest
          --tests com.farmos.app.WaterRecordRuntimeNavigationTest
          --tests com.farmos.app.PastureRecordRuntimeNavigationTest
          --tests com.farmos.app.HealthRecordRuntimeNavigationTest
          --tests com.farmos.app.InventoryRecordRuntimeNavigationTest
          --tests com.farmos.app.AssetRecordRuntimeNavigationTest
          --tests com.farmos.app.LabourRecordRuntimeNavigationTest
          --tests com.farmos.app.GroupRecordRuntimeNavigationTest
          --tests com.farmos.app.SalesRecordRuntimeNavigationTest
          --tests com.farmos.app.ProcurementRecordRuntimeNavigationTest
          --tests com.farmos.app.RabbitCommerceRecordRuntimeNavigationTest
          --tests com.farmos.app.OperationalRuntimeNavigationTest
          --tests com.farmos.app.ReportRuntimeNavigationTest
          --tests com.farmos.app.PlanningVisualWorkspaceTest
          --tests com.farmos.app.GeneticsAndAdvisoryVisualTest
      - name: Retain exact source identity
        if: always()
        run: |
          mkdir -p app/build/reports/native-module-review
          git rev-parse HEAD > app/build/reports/native-module-review/commit.txt
          git rev-parse 'HEAD^{tree}' > app/build/reports/native-module-review/tree.txt
          git status --porcelain=v1 > app/build/reports/native-module-review/worktree-status.txt
          find app/build/reports/native-module-review -name '*.png' -print0 | sort -z | xargs -0 -r sha256sum > app/build/reports/native-module-review/images.sha256
      - name: Upload unapproved native review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: appwide-native-${{ matrix.name }}
          path: |
            app/build/reports/native-module-review/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: error
          retention-days: 14
