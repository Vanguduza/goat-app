project_id = "farm-os"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["farmos://auth/callback"]
jwt_expiry = 3600

[storage]
enabled = true
file_size_limit = "25MiB"

[functions.search-token]
verify_jwt = true

[functions.meili-indexer]
# Worker calls are authorized inside the function with INDEXER_INVOKE_SECRET.
# This allows modern sb_secret_* API keys to remain in the apikey header rather
# than being misused as JWT bearer tokens at the Edge gateway.
verify_jwt = false

[functions.meili-rebuild]
# Worker calls are authorized inside the function with MEILI_REBUILD_SECRET.
verify_jwt = false
