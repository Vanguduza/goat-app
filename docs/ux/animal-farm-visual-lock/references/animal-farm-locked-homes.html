const taskLane=(task)=&gt;state.started.has(task.id)?'doing':task.lane;
function board(){
  const laneTasks=tasks.filter(task=&gt;taskLane(task)===state.lane);
  state.stageIndex=Math.max(0,Math.min(state.stageIndex,laneTasks.length-1));

  return header('My work','Work board')+'&lt;div class=&quot;af-content&quot;&gt;'+
    '&lt;div class=&quot;af-board-banner&quot;&gt;&lt;div&gt;&lt;span class=&quot;af-calendar-number&quot;&gt;30&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Sunday&lt;/strong&gt;&lt;br&gt;&lt;small&gt;August 2026 · 3 due today&lt;/small&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;af-icon-button&quot; data-open=&quot;record&quot; aria-label=&quot;Add a work update&quot;&gt;'+icon('plus')+'&lt;/button&gt;&lt;/div&gt;'+
    '&lt;div class=&quot;af-lanes&quot; aria-label=&quot;Work stages&quot;&gt;'+[['todo','To do'],['doing','Active'],['review','Review'],['later','Later']].map(([id,label])=&gt;'&lt;button type=&quot;button&quot; class=&quot;af-lane&quot; data-lane=&quot;'+id+'&quot; aria-pressed=&quot;'+(state.lane===id)+'&quot;&gt;&lt;span&gt;'+label+'&lt;/span&gt;&lt;span class=&quot;af-lane-count&quot;&gt;'+tasks.filter(t=&gt;taskLane(t)===id).length+'&lt;/span&gt;&lt;/button&gt;').join('')+'&lt;/div&gt;'+
    '&lt;div class=&quot;af-section-title af-review-title&quot;&gt;&lt;h2&gt;Review &amp; decide&lt;/h2&gt;&lt;/div&gt;'+
    (task?'&lt;article class=&quot;af-focus-card&quot; data-stage-card=&quot;'+task.id+'&quot; aria-live=&quot;polite&quot;&gt;&lt;div class=&quot;af-focus-top&quot;&gt;&lt;span class=&quot;af-eyebrow&quot;&gt;'+task.category+'&lt;/span&gt;&lt;span class=&quot;af-pill '+(task.id==='health'?'af-warning':'')+'&quot;&gt;'+task.due+'&lt;/span&gt;&lt;/div&gt;'+
      '&lt;div class=&quot;af-task-portrait&quot;&gt;'+portrait(task.animal==='Nala'?'nala':null,task.art)+'&lt;/div&gt;'+subjectLine(task)+'&lt;h2&gt;'+task.name+'&lt;/h2&gt;&lt;span class=&quot;af-sub&quot;&gt;'+task.meta+'&lt;/span&gt;'+
      '&lt;button type=&quot;button&quot; class=&quot;af-primary&quot; data-task=&quot;'+task.id+'&quot;&gt;'+(state.started.has(task.id)?'Continue task':'Open task')+' '+icon('arrow-right')+'&lt;/button&gt;&lt;/article&gt;'+
      '&lt;div class=&quot;af-deck-nav&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;af-icon-button&quot; data-stage-step=&quot;-1&quot; aria-label=&quot;Previous task&quot; '+(state.stageIndex===0?'disabled':'')+'&gt;'+icon('arrow-left')+'&lt;/button&gt;&lt;div class=&quot;af-deck-dots&quot; aria-hidden=&quot;true&quot;&gt;'+laneTasks.map((_,i)=&gt;'&lt;span class=&quot;af-deck-dot '+(i===state.stageIndex?'active':'')+'&quot;&gt;&lt;/span&gt;').join('')+'&lt;/div&gt;&lt;span class=&quot;af-deck-count&quot; aria-live=&quot;polite&quot;&gt;'+(state.stageIndex+1)+' / '+laneTasks.length+'&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;af-icon-button&quot; data-stage-step=&quot;1&quot; aria-label=&quot;Next task&quot; '+(state.stageIndex===laneTasks.length-1?'disabled':'')+'&gt;'+icon('arrow-right')+'&lt;/button&gt;&lt;/div&gt;':

function render(){
  state.style=state.role==='management'?'control':'board';

  root.querySelectorAll('[data-role]').forEach(el=&gt;el.setAttribute('aria-pressed',String(el.dataset.role===state.role)));
  root.querySelector('#af-direction-label').textContent=state.role==='management'?'Management · A / Control room':'Worker · D / Work board + C task carousel';
  refreshIcons();
}

ary&quot; data-open=&quot;${id==='nest'||id==='kindling'?'resources':'guide-weight'}&quot;&gt;${icon(id==='nest'||id==='kindling'?'package':'book-open')}${id==='nest'||id==='kindling'?'Resources':'Field guide'}&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;af-secondary&quot; data-open=&quot;finding&quot;&gt;${icon('message-square-plus')}Add finding&lt;/button&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;af-primary&quot; ${id==='weight'?'data-open=&quot;weight&quot;':`data-start=&quot;${id}&quot;`}&gt;${id==='weight'?'Record weight':state.started.has(id)?'Add work update':state.role==='management'?'Review &amp; add finding':'Start task'} ${icon('arrow-right')}&lt;/button&gt;&lt;div class=&quot;af-guide-note&quot;&gt;Demo workflow · No farm records are changed&lt;/div&gt;`)}

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);

    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {

    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {

  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {

        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {

          closeTooltip(false);
        }
      });
  };

    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {

    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }

    floating.style.transform = &quot;translate(0, 0)&quot;;

    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);

    window.setTimeout(() =&gt; {

    }
  };

    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);

    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = '.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]';
  const disabled = ':disabled,[aria-disabled=&quot;true&quot;]';
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest('[role=&quot;tablist&quot;]').querySelectorAll('[role=&quot;tab&quot;]')) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role=&quot;tablist&quot;]').querySelectorAll('[role=&quot;tab&quot;]'),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role=&quot;tablist&quot;]')) {
    const selected =
      list.querySelector('[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]') ??
      list.querySelector('[role=&quot;tab&quot;].active') ??
      list.querySelector('[role=&quot;tab&quot;]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
</script>
